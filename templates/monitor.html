{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h3 class="mb-3">🚨 Live IDS Monitor</h3>

    <!-- STATS -->
    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h6>Total Packets</h6>
                <h3 id="totalPackets">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h6>Attacks Detected</h6>
                <h3 id="attackCount">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h6>Normal Traffic</h6>
                <h3 id="normalCount">0</h3>
            </div>
        </div>

    </div>

    <!-- LIVE TABLE -->
    <div class="card shadow">
        <div class="card-header">
            Live Traffic Feed
        </div>

        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Source</th>
                        <th>Status</th>
                        <th>Attack Type</th>
                        <th>Confidence</th>
                    </tr>
                </thead>

                <tbody id="liveTable">
                </tbody>

            </table>
        </div>
    </div>

</div>

<!-- SOCKET -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>

const socket = io();

let total = 0;
let attacks = 0;
let normal = 0;

socket.on("anomaly", (data) => {

    total++;

    if (data.prediction === "ATTACK") {
        attacks++;
    } else {
        normal++;
    }

    document.getElementById("totalPackets").innerText = total;
    document.getElementById("attackCount").innerText = attacks;
    document.getElementById("normalCount").innerText = normal;

    // ADD ROW
    const table = document.getElementById("liveTable");

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${new Date().toLocaleTimeString()}</td>
        <td>${data.src}</td>
        <td>
            <span class="badge ${data.prediction === "ATTACK" ? "bg-danger" : "bg-success"}">
                ${data.prediction}
            </span>
        </td>
        <td>${data.attack_type}</td>
        <td>${data.confidence}%</td>
    `;

    // NEWEST ON TOP
    table.prepend(row);

    // LIMIT ROWS (performance)
    if (table.children.length > 100) {
        table.removeChild(table.lastChild);
    }

});

</script>

{% endblock %}
