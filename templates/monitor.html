{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h3 class="mb-3">🚨 Sentinel IDS Control Panel</h3>

    <!-- ================= STATS ================= -->
    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h6>Total Packets</h6>
                <h3 id="totalPackets">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h6>Attacks Detected</h6>
                <h3 id="attackCount">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h6>Normal Traffic</h6>
                <h3 id="normalCount">0</h3>
            </div>
        </div>

    </div>

    <!-- ================= ATTACK CONTROL ================= -->
    <div class="card shadow mb-4">
        <div class="card-header">
            ⚔️ Attack Simulation Control
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-3">
                    <label>Target IP / Domain</label>
                    <input type="text" id="targetIp" class="form-control" placeholder="your-render-url">
                </div>

                <div class="col-md-2">
                    <label>Port</label>
                    <input type="number" id="targetPort" class="form-control" value="80">
                </div>

                <div class="col-md-2">
                    <label>Duration (sec)</label>
                    <input type="number" id="duration" class="form-control" value="10">
                </div>

                <div class="col-md-2">
                    <label>Rate (pps)</label>
                    <input type="number" id="rate" class="form-control" value="100">
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-danger w-100 me-2" onclick="startAttack()">Start</button>
                    <button class="btn btn-secondary w-100" onclick="stopAttack()">Stop</button>
                </div>

            </div>

            <hr>

            <p><strong>Status:</strong> <span id="attackStatus">Idle</span></p>
            <p><strong>Packets Sent:</strong> <span id="packetsSent">0</span></p>

        </div>
    </div>

    <!-- ================= LIVE TABLE ================= -->
    <div class="card shadow">
        <div class="card-header">
            Live Traffic Feed
        </div>

        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Source</th>
                        <th>Status</th>
                        <th>Attack Type</th>
                        <th>Confidence</th>
                    </tr>
                </thead>

                <tbody id="liveTable"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- SOCKET -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="/static/js/monitor.js"></script>

{% endblock %}
